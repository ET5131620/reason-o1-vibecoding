<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>REASON O1 banner</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Big Bang palette, same tokens as docs/index.html. Rendered to PNG at 1280x640 (GitHub social preview size). */
:root{--bg:#02040a;--txt:#f5f8fc;--mut:#a6b0c0;--dim:#6a7486;--blue:#2f6bff;--ice:#cfe0ff;--core:#fff3e2;--line:rgba(220,232,255,.12)}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;background:var(--bg);font-family:"Space Grotesk",system-ui,sans-serif;color:var(--txt);position:relative}
#stars{position:absolute;inset:0}
.bang{position:absolute;left:560px;top:50%;width:900px;height:900px;transform:translateY(-50%);
 background:radial-gradient(circle,rgba(255,243,226,.55) 0,rgba(207,224,255,.22) 9%,rgba(47,107,255,.16) 26%,rgba(2,4,10,0) 62%)}
.horizon{position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,rgba(2,4,10,0) 30%,rgba(47,107,255,.35) 55%,rgba(255,243,226,.8) 79%,rgba(47,107,255,.35) 95%)}
.copy{position:absolute;left:84px;top:96px;width:560px}
.brand{display:flex;align-items:center;gap:18px}
.brand img.logo{width:84px;height:84px;filter:drop-shadow(0 0 24px rgba(47,107,255,.45))}
.brand img.word{height:40px}
.kicker{margin-top:38px;font:500 15px "JetBrains Mono",monospace;letter-spacing:.22em;color:var(--ice);text-transform:uppercase}
h1{margin-top:14px;font-size:50px;line-height:1.04;font-weight:700;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--ice)}
p{margin-top:18px;font-size:21px;line-height:1.4;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{font:500 13px "JetBrains Mono",monospace;padding:8px 13px;border:1px solid var(--line);border-radius:999px;color:var(--txt);background:rgba(10,14,24,.7)}
.chip b{color:#8fd3ff;font-weight:500}
.shot{position:absolute;right:-70px;top:64px;width:660px;border-radius:14px;border:1px solid rgba(200,220,255,.22);
 box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6),0 0 80px rgba(47,107,255,.18);transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);transform-origin:left center}
.shot2{top:318px;right:36px;width:430px;z-index:2}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,4,10,1) 0,rgba(2,4,10,.85) 42%,rgba(2,4,10,0) 54%);pointer-events:none;z-index:1}
.url{position:absolute;left:84px;bottom:42px;font:500 14px "JetBrains Mono",monospace;color:var(--dim);z-index:3}
.copy{z-index:3}
</style></head><body>
<canvas id="stars" width="1280" height="640"></canvas>
<div class="bang"></div><div class="horizon"></div>
<img class="shot" src="../../docs/assets/readme/shot-kits.webp" alt="">
<img class="shot shot2" src="../../docs/assets/readme/shot-council.webp" alt="">
<div class="fade"></div>
<div class="copy">
 <div class="brand"><img class="logo" src="../../docs/assets/logo.svg" alt=""><img class="word" src="wordmark-clear.svg" alt=""></div>
 <div class="kicker">VibeCoding · v1.0</div>
 <h1>It's not the code.<br><em>It's the setup.</em></h1>
 <p>See every AI tool on your PC. Know what each project is missing — and why.</p>

</div>
<div class="url">github.com/ET5131620/reason-o1-vibecoding</div>
<script>
// deterministic starfield (seeded) so every render is identical
const c=document.getElementById('stars').getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<420;i++){const x=r()*1280,y=r()*640,z=r();c.globalAlpha=.25+z*.7;c.fillStyle=z>.93?'#cfe0ff':z>.8?'#8fb4ff':'#ffffff';c.beginPath();c.arc(x,y,z>.96?1.4:.6+z*.5,0,7);c.fill()}
</script>
</body></html>
