<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REASON O1 · Vibecoding</title>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ui/icons/apple-touch-icon.png">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#04060c;--bg2:#070b16;--panel:rgba(12,18,32,.72);--panel2:rgba(18,26,46,.82);
  --line:rgba(120,180,255,.13);--line2:rgba(120,200,255,.28);
  --txt:#e8f1ff;--mut:#8b9dbb;--dim:#5b6b86;
  --cyan:#38e1ff;--vio:#8b7bff;--pink:#ff5fa2;--amber:#ffb547;--green:#3ddc97;--red:#ff6b5f;
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --f:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
:root{color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:auto;scrollbar-color:rgba(56,225,255,.45) rgba(120,180,255,.06)}
/* barras de scroll visíveis: quem não sabe usar Ctrl+roda tem sempre por onde agarrar */
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:rgba(120,180,255,.05)}
::-webkit-scrollbar-thumb{background:rgba(56,225,255,.38);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:rgba(56,225,255,.65);background-clip:padding-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.5 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
::selection{background:rgba(56,225,255,.3)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

/* ---------- space background ---------- */
.space{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 700px at 78% -10%,rgba(139,123,255,.20),transparent 60%),
             radial-gradient(900px 600px at -10% 110%,rgba(56,225,255,.14),transparent 60%),
             radial-gradient(600px 400px at 50% 50%,rgba(255,95,162,.05),transparent 70%),var(--bg)}
.space::before{content:"";position:absolute;inset:-50%;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(700px) rotateX(62deg) translateY(-8%);opacity:.35;
  mask-image:radial-gradient(ellipse 60% 50% at 50% 35%,#000 20%,transparent 70%);animation:gridflow 22s linear infinite}
@keyframes gridflow{to{background-position:0 64px,0 0}}
#stars{position:absolute;inset:0;width:100%;height:100%}

/* ---------- shell ---------- */
#stage{position:relative;z-index:1;display:grid;grid-template-columns:84px 1fr;grid-template-rows:minmax(0,1fr);height:100%;transition:transform .7s var(--ease),filter .7s var(--ease)}
body.deep #stage{transform:scale(.93);filter:blur(7px) brightness(.4) saturate(.7)}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(8,12,24,.85),rgba(5,8,16,.65));backdrop-filter:blur(14px);min-height:0;overflow-y:auto;overflow-x:hidden}
.rail .logo{width:46px;height:46px;margin-bottom:14px;filter:drop-shadow(0 0 12px rgba(31,123,255,.45))}
.nav{width:66px;padding:9px 0 7px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--mut);font-size:10.5px;letter-spacing:.02em;position:relative;transition:color .2s,background .2s}
.nav svg{width:22px;height:22px}
.nav:hover{color:var(--txt);background:rgba(120,180,255,.06)}
.nav.on{color:var(--cyan);background:rgba(56,225,255,.08)}
.nav.on::before{content:"";position:absolute;left:-9px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.rail .sp{flex:1}
.credit{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.3;padding:0 6px}
.credit a{color:var(--mut)}

main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(5,8,16,.5);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center}.brand .wm{height:24px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(31,123,255,.35))}
.brand span{color:var(--mut);font-size:12px;letter-spacing:.3em;margin-left:8px;white-space:nowrap}
.rail{scrollbar-width:thin}.rail::-webkit-scrollbar{width:5px}
.brand i{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--mut);background:rgba(10,16,30,.6);white-space:nowrap}
.chip.inst{cursor:pointer;color:var(--cyan);border-color:var(--line2);background:rgba(56,225,255,.08);font-weight:600}.chip.inst:hover{background:rgba(56,225,255,.16)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}.dot.new{background:var(--pink);box-shadow:0 0 10px var(--pink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.council-btn{position:relative;border:0;cursor:pointer;padding:9px 18px 9px 14px;border-radius:99px;font-weight:600;letter-spacing:.04em;color:#04101a;
  background:linear-gradient(100deg,var(--cyan),#9b8cff);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 8px 30px -8px rgba(56,225,255,.7);display:flex;align-items:center;gap:8px;transition:transform .25s var(--spring)}
.council-btn:hover{transform:translateY(-1px) scale(1.03)}
.council-btn svg{width:18px;height:18px}

.view-wrap{flex:1;min-height:0;overflow:auto;padding:26px 26px 120px;scroll-behavior:smooth}
.view{display:none;animation:viewin .55s var(--ease)}
.view.on{display:block}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.01em;font-weight:600}
h2{font-size:19px;margin:0 0 12px;font-weight:600}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.lead{color:var(--mut);max-width:780px;margin:0 0 22px}
.mono{font-family:var(--mono);font-size:12.5px}
.mut{color:var(--mut)}.dim{color:var(--dim)}

/* ---------- HUD cards ---------- */
.hud{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px)}
.hud::before,.hud::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--cyan);opacity:.55;pointer-events:none}
.hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:var(--r) 0 0 0}
.hud::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 var(--r) 0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.r1{display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:16px;background:linear-gradient(100deg,rgba(139,123,255,.16),rgba(56,225,255,.06) 60%,transparent);border:1px solid rgba(139,123,255,.3);border-radius:var(--r)}
.r1 .badge{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--pink);color:var(--pink);letter-spacing:.12em}
.graph-box{position:relative;height:440px;padding:0;overflow:hidden}
#graph{width:100%;height:100%;display:block;cursor:crosshair}
.graph-legend{position:absolute;left:16px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);pointer-events:none}
.graph-legend span{display:inline-flex;align-items:center;gap:6px}.graph-legend i{width:8px;height:8px;border-radius:50%}
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ctr{padding:14px 16px;cursor:pointer;transition:transform .3s var(--spring),border-color .3s}
.ctr:hover{transform:translateY(-3px);border-color:var(--line2)}
.ctr .n{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1.05;display:flex;height:1.1em;overflow:hidden;color:var(--txt);text-shadow:0 0 22px rgba(56,225,255,.35)}
.ctr .n .col{display:flex;flex-direction:column;transition:transform 1.6s var(--ease)}
.ctr .n .col span{height:1.1em;line-height:1.1em}
.ctr .k{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;margin-top:4px}
.ctr .k svg{width:16px;height:16px;color:var(--cyan)}
.ctr .bar{height:3px;border-radius:3px;background:rgba(120,180,255,.1);margin-top:10px;overflow:hidden}
.ctr .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--vio));transition:width 1.6s var(--ease)}

/* big actions */
.cta{display:flex;align-items:center;gap:16px;padding:18px;cursor:pointer;border:1px solid var(--line);text-align:left;background:var(--panel);border-radius:var(--r);transition:transform .35s var(--spring),border-color .3s,box-shadow .3s;width:100%}
.cta:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 18px 50px -20px rgba(56,225,255,.45)}
.cta .ic{width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%),var(--c,var(--cyan));color:#04101a;box-shadow:0 0 30px -6px var(--c,var(--cyan))}
.cta .ic svg{width:28px;height:28px}
.cta b{display:block;font-size:16px}.cta small{color:var(--mut)}

/* combos */
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.combo{padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,30,.6);cursor:pointer;text-align:left;transition:transform .3s var(--spring),border-color .3s}
.combo:hover{transform:translateY(-2px);border-color:var(--line2)}
.combo .dots{display:flex;gap:5px;margin:8px 0 4px}.combo .dots i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.combo .dots svg{width:15px;height:15px}

/* kit universe */
.universe{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.kit{--c:var(--cyan);position:relative;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px 18px 16px;cursor:pointer;text-align:left;overflow:hidden;
  transition:transform .45s var(--spring),border-color .3s,box-shadow .4s;animation:rise .7s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
.kit::before{content:"";position:absolute;inset:-40% -40% auto auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 65%);opacity:.5;transition:opacity .4s,transform .6s var(--ease)}
.kit:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 22px 60px -24px var(--c)}
.kit:hover::before{opacity:.9;transform:scale(1.25)}
.kit .orb{position:relative;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,rgba(8,12,24,.9));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 24px -6px var(--c) inset}
.kit .orb svg{width:28px;height:28px}
.kit b{display:block;margin:14px 0 4px;font-size:15.5px}
.kit p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kit .meta{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
td[data-f]{white-space:nowrap}td[data-f] svg{vertical-align:-1px;color:var(--amber)}
.tag{white-space:nowrap;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--green);border-color:rgba(61,220,151,.35)}.tag.no{color:var(--amber);border-color:rgba(255,181,71,.35)}
.tag.ess{color:#04101a;background:var(--c,var(--cyan));border-color:transparent}.tag.me{color:var(--vio);border-color:rgba(139,123,255,.45)}
/* kit progress ring: how much of the 7 you already have */
.kit .ring{position:absolute;top:16px;right:16px;width:46px;height:46px}.kit .ring circle{fill:none;stroke-width:3.5}
.kit .ring .bg{stroke:rgba(255,255,255,.08)}.kit .ring .fg{stroke:var(--c);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray 1.2s var(--ease);filter:drop-shadow(0 0 4px var(--c))}
.kit .ring text{fill:var(--ink);font:600 11px var(--mono);text-anchor:middle}
.kit.mine{border-style:dashed}
.kitbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 18px}
/* overview kit map + applicability (the old map's "Aplicabilidade") */
.kmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.kdot{--c:var(--cyan);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(10,16,30,.55);cursor:pointer;color:var(--ink);font-size:11.5px;text-align:center;transition:transform .35s var(--spring),border-color .3s,box-shadow .3s;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*35ms)}
.kdot:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 14px 34px -18px var(--c)}
.kdot .o{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,rgba(8,12,24,.9));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}.kdot .o svg{width:21px;height:21px}
.kdot small{color:var(--mut);font-family:var(--mono);font-size:10px}
.abar{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;padding:5px 0;cursor:pointer;font-size:13px}
.abar .trk{height:9px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden;display:flex}
.abar .trk i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width 1.1s var(--ease);transition-delay:calc(var(--i)*50ms)}
.abar .v{font-family:var(--mono);font-size:11.5px;color:var(--mut);text-align:right}
@media (max-width:640px){.abar{grid-template-columns:110px 1fr 54px}}
.minelist{display:flex;flex-wrap:wrap;gap:6px}.minelist span{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(10,16,30,.6)}
/* trends */
.tcard{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,30,.55);text-decoration:none;color:inherit;transition:border-color .3s,transform .3s var(--spring)}
.tcard:hover{border-color:var(--line2);transform:translateY(-2px)}.tcard img{width:34px;height:34px;border-radius:9px;flex:none}
.tcard .n{font:600 13.5px var(--display);word-break:break-word}.tcard .d{color:var(--mut);font-size:12.5px;margin-top:3px}
.tlist{display:grid;gap:10px}.hot{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.hot b{flex:1}.hot .tag{margin-left:auto}
/* maker */
.pick{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}.pick input{margin-top:3px}
.pick.have{opacity:.75}.pick small{color:var(--mut);display:block}

/* cinematic kit layer */
#layer{position:fixed;inset:0;z-index:20;pointer-events:none}
#layer .veil{position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(56,225,255,.12),rgba(2,4,10,.55) 45%);opacity:0;transition:opacity .5s}
#layer.open{pointer-events:auto}
#layer.open .veil{opacity:1}
.sheet{--c:var(--cyan);position:absolute;top:0;right:0;bottom:0;width:min(980px,96vw);background:linear-gradient(160deg,rgba(14,20,38,.97),rgba(6,9,18,.98));border-left:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  clip-path:circle(0 at var(--sx,100%) var(--sy,50%));transition:clip-path .85s var(--ease);overflow:auto;box-shadow:-40px 0 120px -30px color-mix(in srgb,var(--c) 50%,transparent)}
/* raio absoluto: nenhuma distância no ecrã excede a diagonal (~1,42vmax), por isso nada fica cortado */
#layer.open .sheet{clip-path:circle(150vmax at var(--sx,100%) var(--sy,50%))}
.sheet-in{padding:30px 34px 60px}
.shock{position:fixed;left:var(--x);top:var(--y);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--c,var(--cyan));pointer-events:none;z-index:21;animation:shock .9s var(--ease) forwards}
@keyframes shock{to{transform:scale(60);opacity:0;border-width:.5px}}
.sheet .close{position:sticky;top:0;float:right;margin:-10px -14px 0 0;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(8,12,24,.8);cursor:pointer;display:grid;place-items:center;z-index:2}
.sheet .close svg{width:18px;height:18px}
.kh{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.kh .orb{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 50px -10px var(--c);animation:orbin .9s var(--spring) both .25s}
@keyframes orbin{from{transform:scale(.3) rotate(-40deg);opacity:0}}
.kh .orb svg{width:38px;height:38px}
.kh h1{font-size:28px}
.cascade>*{animation:cas .6s var(--ease) both;animation-delay:calc(.3s + var(--i,0)*45ms)}
@keyframes cas{from{opacity:0;transform:translateX(26px)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--txt);border-color:var(--c,var(--cyan))}
.pane{display:none}.pane.on{display:block;animation:viewin .45s var(--ease)}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.big{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);text-align:left;transition:transform .3s var(--spring),background .3s}
.big:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 18%,transparent)}
.big svg{width:24px;height:24px;color:var(--c);flex:none}.big b{display:block}.big small{color:var(--mut)}
.big.solid{background:var(--c);color:#04101a;border-color:transparent}.big.solid svg{color:#04101a}.big.solid small{color:rgba(4,16,26,.7)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:9px 10px;border-bottom:1px solid rgba(120,180,255,.06);vertical-align:middle}
tr:hover td{background:rgba(120,180,255,.035)}
.who{display:flex;align-items:center;gap:9px}
.who img{width:26px;height:26px;border-radius:8px;background:#0c1426;flex:none}
.who .ph{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#132040,#0a1224);flex:none}
.getb{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:600;font-size:12.5px;color:#04101a;background:var(--c,var(--cyan));box-shadow:0 0 18px -4px var(--c,var(--cyan));white-space:nowrap;transition:transform .2s var(--spring),box-shadow .2s}

.pair:hover{border-color:var(--c,var(--cyan));background:rgba(56,225,255,.06)}

.icard{display:flex;gap:14px;align-items:center}.icard img,.icard .ph{width:52px;height:52px;border-radius:14px;flex:none;background:#0c1426}

.t-type{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:rgba(120,180,255,.08);color:var(--mut)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}

/* forms */
input[type=text],input[type=email],textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(4,8,18,.8);color:var(--txt);font:inherit}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.15)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;border:1px solid var(--line2);background:rgba(56,225,255,.06);cursor:pointer;transition:background .2s,transform .2s}

.btn.pri{background:var(--cyan);color:#04101a;border-color:transparent;font-weight:600}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}

/* inventory */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.pill b{font-family:var(--mono);margin-left:4px}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}

/* learn: painel estreito à direita + infográfico animado à esquerda */
.sheet.narrow{width:min(600px,48vw)}.sheet.mid{width:min(760px,94vw)}
.lstage{position:absolute;left:0;top:0;bottom:0;right:min(600px,48vw);display:flex;align-items:center;justify-content:center;padding:40px 48px;opacity:0;transform:translateX(-40px);transition:opacity .6s .3s var(--ease),transform .7s .3s var(--ease);pointer-events:none;overflow:auto}
.lstage:empty{display:none}
#layer.open .lstage{opacity:1;transform:none;pointer-events:auto}
.info{--c:var(--cyan);position:relative;width:min(560px,100%)}
.info .ititle{font-size:30px;font-weight:600;margin:4px 0 18px;letter-spacing:-.01em}
.ibody{position:relative}
.iline{position:absolute;left:27px;top:42px;bottom:42px;width:2px;background:rgba(120,180,255,.12);border-radius:2px}
.iline i{display:block;width:100%;height:0;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff));box-shadow:0 0 12px var(--c);border-radius:2px;transition:height .9s var(--ease)}
.packet{position:absolute;left:23px;top:37px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--c),0 0 22px 6px var(--c);transition:top .9s var(--ease);z-index:2}
.istep{position:relative;display:flex;gap:18px;align-items:flex-start;padding:14px 0;cursor:pointer;background:none;border:0;text-align:left;width:100%;color:inherit;font:inherit}
.istep .nd{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font:600 18px var(--mono);border:1px solid var(--line2);background:rgba(8,12,24,.92);flex:none;color:var(--mut);transition:all .5s var(--spring)}
.istep.done .nd{color:var(--txt);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.istep.on .nd{color:var(--c);border-color:var(--c);box-shadow:0 0 34px -4px var(--c);transform:scale(1.1)}
.istep .tx{padding-top:6px}.istep .tx b{font-size:18px;display:block;transition:color .3s}.istep.on .tx b{color:var(--c)}
.istep .tx p{margin:6px 0 0;color:var(--mut);font-size:14px;line-height:1.55;max-height:0;overflow:hidden;opacity:0;transition:max-height .6s var(--ease),opacity .5s}
.istep.on .tx p{max-height:160px;opacity:1}
.icontrols{display:flex;gap:10px;align-items:center;margin-top:14px}
.ldetail{border-left:3px solid var(--c);padding:12px 16px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--c) 7%,transparent);animation:viewin .45s var(--ease)}
.ldetail b{color:var(--c)}
.lchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.lchip{border:1px solid var(--line);background:rgba(10,16,30,.6);color:var(--mut);padding:6px 11px;border-radius:99px;cursor:pointer;font:inherit;font-size:12.5px}
.lchip.on{color:#04101a;background:var(--c);border-color:transparent;font-weight:600}
@media (max-width:1000px){.lstage{display:none}.sheet.narrow{width:min(980px,96vw)}}
/* tendências: tudo clicável */
button.tcard{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.hotb{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;font:inherit;transition:padding .25s var(--ease)}
.hotb:hover{padding-left:6px}.hotb:hover b{color:var(--cyan)}.hotb .chev{color:var(--dim);margin-left:6px}.hotb:hover .chev{color:var(--cyan)}
.readme{white-space:pre-wrap;font:12.5px/1.6 var(--mono);color:var(--mut);max-height:300px;overflow:auto;padding:12px 14px;border-radius:12px;background:rgba(2,6,14,.75);border:1px solid var(--line)}
.srcs{display:grid;gap:6px}.srcs a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;border:1px solid var(--line);color:inherit;font-size:13px}.srcs a:hover{border-color:var(--line2);text-decoration:none}.srcs .f{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.duo .plusbig{font:600 28px var(--mono);color:var(--cyan)}
/* uso */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px}.kpi .v{font:600 clamp(20px,2.4vw,30px)/1.1 var(--mono);white-space:nowrap;color:var(--txt);margin:6px 0 2px}.kpi .s{color:var(--mut);font-size:12.5px}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block}
.chart .tt{position:absolute;pointer-events:none;padding:8px 11px;border-radius:10px;background:rgba(4,8,18,.96);border:1px solid var(--line2);font-size:12.5px;white-space:nowrap;display:none;z-index:2}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin:4px 0 8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gauge{height:12px;border-radius:12px;background:rgba(120,180,255,.08);overflow:hidden;margin:10px 0 6px}.gauge i{display:block;height:100%;border-radius:12px;transition:width 1.2s var(--ease)}
.tips li{margin:8px 0;line-height:1.55}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* apresentação de abertura */
#intro{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:24px 16px;overflow:auto;
  background:radial-gradient(900px 600px at 50% 30%,rgba(31,123,255,.22),transparent 65%),radial-gradient(700px 500px at 80% 90%,rgba(139,123,255,.16),transparent 60%),#03050b}
#intro.on{display:grid;animation:fadein .6s var(--ease)}#intro.out{animation:fadeout .7s var(--ease) forwards}

.intro-in h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.02em;margin:0 0 14px;background:linear-gradient(100deg,#fff,var(--cyan) 55%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-in p{color:#b9c7dd;font-size:clamp(15px,2vw,18px);line-height:1.65;margin:0 0 14px}
.intro-in .motto{font:600 clamp(14px,1.8vw,16px) var(--mono);color:var(--cyan);letter-spacing:.06em;margin:22px 0 6px}
.intro-in .sig{color:var(--mut);font-size:14px}.intro-in .sig b{color:var(--txt)}
.intro-in .soon{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:99px;border:1px solid rgba(255,95,162,.4);color:#ffb3d2;font-size:13px}
.intro-btns{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.intro-in .ln{opacity:1;transform:none;animation:none}.intro-logo,.intro-logo::after{animation:none}}
/* cursos e pacote de arranque */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.course{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,30,.6);color:inherit}
.course:hover{border-color:var(--line2);text-decoration:none}.course b{font-size:14px}.course small{color:var(--mut);font-size:12.5px;line-height:1.45}.course .who{font:11px var(--mono);color:var(--cyan);text-transform:uppercase;letter-spacing:.1em}
.pack-g{margin:12px 0 4px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.terms{max-height:300px;overflow:auto;padding:4px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(2,6,14,.6);font-size:13.5px;line-height:1.6}
.terms li{margin:8px 0;color:#c6d3e6}.terms b{color:var(--txt)}
/* dicas "Saiba que" */
.hintbtn{position:fixed;right:22px;bottom:96px;z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:rgba(8,12,24,.92);color:var(--cyan);font:600 18px var(--mono);cursor:pointer;box-shadow:0 0 24px -6px rgba(56,225,255,.6);transition:transform .25s var(--spring)}
.hintbtn:hover{transform:scale(1.08)}.hintbtn.ping::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--cyan);animation:hping 1.6s infinite}
@keyframes hping{to{transform:scale(1.5);opacity:0}}
.hint{position:fixed;right:22px;bottom:148px;z-index:7;width:min(360px,calc(100vw - 32px));padding:16px 16px 14px;border-radius:16px;border:1px solid var(--line2);background:rgba(8,12,24,.97);box-shadow:0 20px 60px -20px rgba(56,225,255,.45);display:none}
.hint.on{display:block;animation:pop .45s var(--spring)}
.hint .hh{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--cyan);margin-bottom:6px}
.hint p{margin:0 0 12px;color:var(--txt);font-size:14px;line-height:1.55}
.hint .row .btn{padding:7px 12px;font-size:13px}
.hint .off{background:none;border:0;color:var(--dim);font-size:11.5px;cursor:pointer;margin-left:auto;text-decoration:underline}
@media (max-width:860px){.hintbtn{bottom:136px;right:12px}.hint{bottom:186px;right:12px}}
/* learn */
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lc{text-align:left;cursor:pointer;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);transition:transform .35s var(--spring),border-color .3s}
.lc:hover{transform:translateY(-3px);border-color:var(--line2)}
.lc .big-letter{font-family:var(--mono);font-size:32px;font-weight:600;background:linear-gradient(120deg,var(--c),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.flowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}
.flowline span{padding:7px 11px;border-radius:9px;border:1px solid var(--line2);background:rgba(10,16,30,.7);font-size:13px}
.flowline i{color:var(--cyan);font-style:normal}

/* advice */
.passport{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.passport dt{color:var(--mut)}.passport dd{margin:0}
.kbar{display:grid;grid-template-columns:200px 1fr 46px;gap:12px;align-items:center;padding:8px 0;cursor:pointer}
.kbar .tr{height:8px;border-radius:8px;background:rgba(120,180,255,.08);overflow:hidden}
.kbar .tr i{display:block;height:100%;border-radius:8px;background:var(--c);box-shadow:0 0 14px var(--c);width:0;transition:width 1.2s var(--ease)}
.answer{white-space:pre-wrap;font-size:13.5px;line-height:1.6;max-height:520px;overflow:auto;padding:14px;border-radius:12px;background:rgba(2,6,14,.7);border:1px solid var(--line)}
.scan-line{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 1.2s linear infinite;margin:12px 0}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* command bar */
.cmd{position:fixed;left:84px;right:0;bottom:0;z-index:5;padding:12px 26px 16px;background:linear-gradient(0deg,rgba(4,6,12,.96) 55%,transparent)}
.cmd-in{display:flex;gap:8px;align-items:center;max-width:1100px;margin:0 auto;padding:6px 6px 6px 14px;border-radius:16px;border:1px solid var(--line2);background:rgba(8,12,24,.92);box-shadow:0 10px 40px -10px rgba(56,225,255,.35);backdrop-filter:blur(14px)}
.cmd-in svg{width:18px;height:18px;color:var(--cyan);flex:none}
.cmd-in input{border:0;background:none;box-shadow:none!important;padding:10px 4px}
.cmd-in select{width:auto;padding:8px 10px;background:rgba(56,225,255,.06)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#results{max-width:1100px;margin:0 auto 8px;max-height:46vh;overflow:auto;border-radius:14px;border:1px solid var(--line);background:rgba(8,12,24,.97);display:none}

.res{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(120,180,255,.06);cursor:pointer}
.res:hover{background:rgba(56,225,255,.06)}

/* modal + toast + tip */
.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(2,4,10,.7);backdrop-filter:blur(6px);padding:16px}
.modal.on{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal .box{width:min(760px,100%);max-height:90vh;overflow:hidden auto;padding:24px;animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);transition:.35s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#tip{position:fixed;z-index:70;max-width:300px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;background:rgba(10,16,30,.97);border:1px solid var(--line2);box-shadow:0 12px 40px -10px #000;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
#tip.on{opacity:1;transform:none}

/* wizard */
.wiz-steps{display:flex;gap:6px;margin-bottom:18px}.wiz-steps i{flex:1;height:3px;border-radius:3px;background:rgba(120,180,255,.12)}.wiz-steps i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* futuristic icon glow + spinning ring on kit orbs */
.ico .nd{filter:drop-shadow(0 0 2px currentColor)}
.kit .orb svg,.kh .orb svg,.cta .ic svg,.nav.on svg,.combo .dots svg{filter:drop-shadow(0 0 5px currentColor)}
.cta .ic svg{filter:none}
.kit .orb::after,.kh .orb::after{content:"";position:absolute;inset:-5px;border-radius:22px;padding:1.5px;background:conic-gradient(from var(--a,0deg),transparent 0 62%,var(--c) 82%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;animation:ring 3.2s linear infinite}
.kh .orb{position:relative}.kh .orb::after{opacity:1;border-radius:26px}
.kit:hover .orb::after{opacity:1}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ring{to{--a:360deg}}
/* animated workflow */
.flow-wrap{overflow-x:auto;padding:8px 2px}
.flow{width:100%;height:auto;display:block;margin:0 auto;overflow:visible;font-family:var(--f)}
.fl-base{fill:none;stroke:rgba(120,180,255,.18);stroke-width:1.4}
.fl-dash{fill:none;stroke-width:1.8;stroke-dasharray:4 10;opacity:.85;animation:dash 1.1s linear infinite}

.fl-t{fill:#e8f1ff;font-size:13px;font-weight:600}.fl-s{fill:#8b9dbb;font-size:10.5px;font-family:var(--mono)}
.stepcard{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(10,16,30,.55);margin-bottom:10px;animation:cas .6s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.stepcard .num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:var(--cyan);border:1px solid var(--line2);background:rgba(56,225,255,.06);box-shadow:0 0 18px -6px var(--cyan) inset}
.code{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 8px 8px 12px;border-radius:10px;background:rgba(2,6,14,.85);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;overflow-x:auto}

    nodes.push({x: W / 2, y: H / 2, r: 16, c: "#e8f1ff", label: (S.st?.config?.owner?.nome || T("O teu PC")), hub: true, center: true});

      if (n.hub) { cx.strokeStyle = n.c + "55"; cx.lineWidth = 1; cx.beginPath(); cx.arc(n.x, n.y, n.r + 7 + (RM ? 0 : Math.sin(t / 700 + (n.a || 0)) * 2), 0, 7); cx.stroke();
        // labels sit on the outside of each hub, away from the spoke to the centre
        cx.fillStyle = "#e8f1ff"; cx.font = `${n.center ? 600 : 500} 12.5px "Space Grotesk",system-ui`;
        if (n.center) { cx.textAlign = "center"; cx.fillText(n.label, n.x, n.y + n.r + 22); }

    }
    if (hover && !hover.hub) { const txt = hover.label; cx.font = "12px 'JetBrains Mono',monospace"; const w = cx.measureText(txt).width + 16; cx.fillStyle = "rgba(8,12,24,.95)"; cx.strokeStyle = hover.c; cx.beginPath(); cx.roundRect(hover.x + 10, hover.y - 26, w, 22, 6); cx.fill(); cx.stroke(); cx.fillStyle = "#e8f1ff"; cx.textAlign = "left"; cx.fillText(txt, hover.x + 18, hover.y - 11); }
    if (!RM) raf = requestAnimationFrame(draw);

/* ---------- USO: tokens, limites e saldos ---------- */
const fmtTok = n => n >= 1e9 ? (n / 1e9).toFixed(2).replace(".", ",") + " mil M" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : n >= 1e3 ? Math.round(n / 1e3) + " k" : String(n || 0);
const fmtInt = n => (n || 0).toLocaleString({pt: "pt-PT", en: "en-GB", fr: "fr-FR", es: "es-ES"}[L.lang]);
function usageChart(days) {
  const W = 900, H = 230, pl = 70, pb = 26, pt = 10, bw = (W - pl - 10) / days.length;
  const max = Math.max(1, ...days.map(d => d.claude + d.codex)), y = v => H - pb - (v / max) * (H - pb - pt);
  const ticks = [0, .5, 1].map(f => max * f);
  return `<div class="legend"><span><i style="background:var(--cyan)"></i>Claude Code</span><span><i style="background:var(--vio)"></i>Codex</span></div>
  <div class="chart" id="uChart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens por dia, últimos 30 dias">
  ${ticks.map(t => `<line x1="${pl}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(120,180,255,.1)"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#5b6b86" font-family="JetBrains Mono,monospace">${fmtTok(t)}</text>`).join("")}
  ${days.map((d, i) => { const x = pl + i * bw + 2, w = Math.max(2, bw - 4), hc = (H - pb) - y(d.claude), hx = (H - pb) - y(d.codex);
    return `<g data-i="${i}"><rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pb - pt}" fill="transparent"/>${d.claude ? `<rect x="${x}" y="${y(d.claude)}" width="${w}" height="${hc}" rx="3" fill="var(--cyan)" opacity=".85"/>` : ""}${d.codex ? `<rect x="${x}" y="${y(d.claude) - hx - (d.claude ? 2 : 0)}" width="${w}" height="${hx}" rx="3" fill="var(--vio)"/>` : ""}${i % 5 === 4 || i === days.length - 1 ? `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="#5b6b86" font-family="JetBrains Mono,monospace">${d.dia.slice(8)}/${d.dia.slice(5, 7)}</text>` : ""}</g>`; }).join("")}
  </svg><div class="tt"></div></div>`;
}
function bindUsageChart(days) {
  const box = $("#uChart"); if (!box) return; const tt = $(".tt", box);
  box.addEventListener("mousemove", e => { const g = e.target.closest("g[data-i]"); if (!g) return tt.style.display = "none"; const d = days[+g.dataset.i], r = box.getBoundingClientRect();
    tt.innerHTML = `<b>${d.dia}</b><br>Claude Code: ${fmtInt(d.claude)}<br>Codex: ${fmtInt(d.codex)}`; tt.style.display = "block";
    tt.style.left = Math.min(e.clientX - r.left + 12, r.width - 190) + "px"; tt.style.top = (e.clientY - r.top - 60) + "px"; });
  box.addEventListener("mouseleave", () => tt.style.display = "none");
}

    $("#uOn").onclick = async () => { await api("/api/config", {consent: {uso: true}}); S.st.config.consent = {...(S.st.config.consent || {}), uso: true}; RENDER.uso(); };

  }
  v.innerHTML = head + `<div class="hud"><div class="scan-line"></div><p class="mut">A ler os registos… a primeira vez pode demorar meio minuto.</p></div>`;
  const [u, pv] = await Promise.all([api("/api/usage" + (refresh ? "?refresh=1" : "")).catch(() => ({erro: "Não consegui ler."})), api("/api/providers").catch(() => ({}))]);

  const d30 = u.dias30, cacheShare = d30.total ? Math.round(100 * d30.cache_lida / d30.total) : 0, top = u.por_projeto[0];
  const lim = u.codex_limite, limPast = lim?.renova && new Date(lim.renova.replace(" ", "T")) < new Date();
  const or = pv.openrouter || {}, om = pv.omniroute || {};
  const tips = [];
  if (cacheShare >= 70) tips.push(`<b>${cacheShare}%</b> dos teus tokens dos últimos 30 dias foram <b>cache lida</b> — contexto que o agente releu sem o pagar ao preço normal. É bom sinal: mantém as sessões estáveis e não mudes o início do contexto a meio.`);
  else if (d30.total) tips.push(`Só <b>${cacheShare}%</b> dos tokens vieram da cache. Sessões curtas e contextos que mudam no início fazem o agente reler tudo ao preço normal: mantém um CLAUDE.md curto e estável.`);
  if (top && d30.total) tips.push(`O projeto <b>${esc(top.projeto)}</b> levou <b>${Math.round(100 * top.tokens / d30.total)}%</b> dos tokens. Um mapa do projeto (Graphify) e regras curtas (Karpathy guidelines) diminuem o que o agente tem de ler de cada vez.`);
  if (lim?.usado != null && !limPast && lim.usado >= 80) tips.push(`O Codex está a <b>${lim.usado}%</b> do limite até ${esc(lim.renova)}. Desvia tarefas simples para modelos grátis com o OmniRoute em vez de esperar.`);
  if (or.saldo != null && or.saldo < 5) tips.push(`O saldo do OpenRouter está baixo: <b>$${or.saldo.toFixed(2)}</b>. Os modelos <span class="mono">:free</span> continuam a funcionar sem crédito.`);
  if (d30.pedidos) tips.push(`Em média, cada pedido gerou <b>${fmtInt(Math.round(d30.saida / d30.pedidos))}</b> tokens de resposta. Pedidos mais concretos (o quê, onde, como saber que está feito) dão respostas mais curtas e certeiras.`);
  const kpi = (l, x, sub) => `<div class="hud kpi"><div class="label">${l}</div><div class="v">${fmtTok(x.total)}</div><div class="s">${fmtInt(x.pedidos)} pedidos · ${fmtTok(x.saida)} de resposta${sub ? " · " + sub : ""}</div></div>`;
  const bars = (rows, key, lab) => { const mx = Math.max(1, ...rows.map(r => r.tokens)); return rows.map((r, i) => `<div class="abar" style="--c:${i ? "var(--vio)" : "var(--cyan)"};--i:${i}"><span class="mono" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(lab(r))}">${esc(lab(r))}</span><div class="trk"><i style="width:${(100 * r.tokens / mx).toFixed(1)}%"></i></div><span class="mono dim" style="font-size:12px;text-align:right">${fmtTok(r.tokens)}</span></div>`).join("") || `<p class="dim">Sem dados.</p>`; };
  v.innerHTML = head + `<div class="kitbar"><button class="btn" id="uRef">${ic("refresh", 16)} Ler outra vez</button><span class="chip">${u.ficheiros.claude} registos Claude Code · ${u.ficheiros.codex} Codex</span><span class="chip">lido ${esc(u.gerado)}</span></div>
  <div class="kpis">${kpi("Hoje", u.hoje)}${kpi("Últimos 7 dias", u.dias7)}${kpi("Últimos 30 dias", d30)}<div class="hud kpi"><div class="label">Cache lida · 30 dias</div><div class="v">${cacheShare}%</div><div class="s">${fmtTok(d30.cache_lida)} de ${fmtTok(d30.total)}</div></div></div>
  <div class="hud" style="margin-bottom:16px"><h3>Tokens por dia · últimos 30 dias</h3>${usageChart(u.por_dia)}<p class="dim" style="font-size:12px;margin:6px 0 0">Tokens = entrada + cache escrita + cache lida + resposta. Passa o rato pelas barras.</p></div>
  <div class="grid g2" style="margin-bottom:16px">
   <div class="hud"><h3>Limites e saldos</h3>
    <div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>Codex${lim?.plano ? " · plano " + esc(lim.plano) : ""}</b><span class="mono dim" style="font-size:12px">${lim ? (limPast ? "janela já renovada" : `renova ${esc(lim.renova || "—")}`) : ""}</span></div>
     ${lim?.usado != null ? `<div class="gauge"><i style="width:${limPast ? 0 : lim.usado}%;background:${!limPast && lim.usado >= 80 ? "var(--amber)" : "var(--vio)"}"></i></div><div class="mut" style="font-size:12.5px">${limPast ? "O limite renovou desde o último uso." : `${lim.usado}% usado na janela de ${Math.round((lim.janela_min || 0) / 60)} h`} · visto ${esc(lim.visto)}</div>` : `<p class="dim" style="margin:6px 0 0">Sem dados de limite nos registos do Codex.</p>`}</div>
    <div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>OpenRouter</b>${or.configurada ? `<a class="mono" style="font-size:12px" href="https://openrouter.ai/activity" target="_blank" rel="noopener">atividade ↗</a>` : ""}</div>
     ${!or.configurada ? `<p class="mut" style="margin:6px 0 0;font-size:13px">Define a variável de ambiente <span class="mono">OPENROUTER_API_KEY</span> para ver aqui o saldo. A chave fica no teu PC e nunca aparece nesta página.</p>` : or.erro ? `<p class="dim">${esc(or.erro)}</p>` : `${or.creditos ? `<div class="gauge"><i style="width:${Math.max(0, Math.min(100, 100 * (or.saldo || 0) / or.creditos)).toFixed(0)}%;background:${(or.saldo || 0) < 5 ? "var(--amber)" : "var(--green)"}"></i></div>` : ""}<div class="mut" style="font-size:12.5px">${or.saldo != null ? `Saldo <b style="color:var(--txt)">$${or.saldo.toFixed(2)}</b> de $${or.creditos} · ` : ""}gasto total $${(or.usado || 0).toFixed(2)}</div>`}</div>
    <div><div class="row" style="justify-content:space-between"><b>OmniRoute</b><span class="chip"><i class="dot ${om.a_correr ? "ok" : ""}"></i>${om.a_correr ? "a correr" : "parado"}</span></div><p class="mut" style="margin:6px 0 0;font-size:13px">${om.a_correr ? `Gateway ativo${om.modelos ? " com " + om.modelos + " modelos" : ""}. O painel mostra o uso por fornecedor: <a href="http://localhost:20128" target="_blank" rel="noopener">localhost:20128</a>.` : `Não está a correr. Arranca com <span class="mono">omniroute</span> ou vê os passos na página APIs.`}</p></div>
    <p class="dim" style="font-size:12px;margin:14px 0 0">Saldos da Anthropic e da OpenAI só se leem nos painéis delas (<a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> · <a href="https://platform.openai.com/usage" target="_blank" rel="noopener">platform.openai.com</a>) ou com uma chave de administração. Chaves no ambiente: ${Object.entries(pv.chaves || {}).filter(([, on]) => on).map(([k]) => `<span class="mono">${k}</span>`).join(", ") || "nenhuma"}.</p></div>
   <div class="hud"><h3>Como gastar menos</h3><ul class="tips mut" style="padding-left:18px;margin:0">${tips.map(t => `<li>${t}</li>`).join("")}</ul></div></div>
  <div class="grid g2"><div class="hud"><h3>Por projeto · 30 dias</h3>${bars(u.por_projeto, "tokens", r => r.projeto)}</div><div class="hud"><h3>Por modelo · 30 dias</h3>${bars(u.por_modelo, "tokens", r => `${r.modelo} · ${r.motor === "codex" ? "Codex" : "Claude"}`)}</div></div>`;
  bindUsageChart(u.por_dia);
  requestAnimationFrame(() => $$(".gauge i", v).forEach(i => { const w = i.style.width; i.style.width = "0"; requestAnimationFrame(() => i.style.width = w); }));
  $("#uRef").onclick = () => RENDER.uso(true);
};

function runInfo(root, l) {
  const steps = $$(".istep", root), pk = $(".packet", root), fill = $(".iline i", root), cnt = $("[data-icount]", root), playBtn = $("[data-iplay]", root);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cur = 0, playing = !reduced;
  const show = n => {
    cur = n; steps.forEach((s, k) => { s.classList.toggle("on", k === n); s.classList.toggle("done", k < n); });
    const y = steps[n].offsetTop + 14 + 28 - 5; pk.style.top = y + "px"; fill.style.height = Math.max(0, y - 37) + "px";
    cnt.textContent = `passo ${n + 1} de ${steps.length}`;
    $$(".lchip", $("#sheet")).forEach((c, k) => c.classList.toggle("on", k === n));
    const d = $("#lDetail"); if (d) d.innerHTML = `<div class="ldetail"><div class="label">Passo ${n + 1} · ${esc(l.how[n])}</div><p style="margin:6px 0 0">${esc(LEARN_STEPS[l.id]?.[n] || "")}</p></div>`;
  };
  const setPlay = p => { playing = p; clearInterval(S.infoT); if (p) S.infoT = setInterval(() => show((cur + 1) % steps.length), 3400); playBtn.innerHTML = p ? `${ic("pause", 16)} Pausa` : `${ic("play", 16)} Animar`; };
  steps.forEach((s, k) => s.onclick = () => { show(k); setPlay(false); });
  $$(".lchip", $("#sheet")).forEach((c, k) => c.onclick = () => { show(k); setPlay(false); });
  playBtn.onclick = () => setPlay(!playing);
  setTimeout(() => show(0), 450); setPlay(playing);
}

    for (const s of S.inv?.skills || []) if ((s.nome + s.desc).toLowerCase().includes(q)) hits.push({h: `<span class="t-type">Skill</span><b>${esc(s.nome)}</b><span class="mut">${esc(s.onde)}</span><span class="tag ok">instalada</span>`, a: () => { invTab = "skills"; go("inv"); $("#invQ").value = s.nome; $("#invQ").dispatchEvent(new Event("input")); }});
    for (const m of S.inv?.mcp || []) if (m.nome.toLowerCase().includes(q)) hits.push({h: `<span class="t-type">MCP</span><b>${esc(m.nome)}</b><span class="mut">${esc(m.onde)}</span>`, a: () => { invTab = "mcp"; go("inv"); }});

    res._hits = hits; res.classList.add("on");
  };
  inp.oninput = find;
  res.onclick = ev => { const r = ev.target.closest(".res[data-i]"); if (r) { res._hits[r.dataset.i].a(ev); res.classList.remove("on"); } };
  const goCmd = () => {
    const q = inp.value.trim(), mode = $("#cmdMode").value; if (!q) return;

  let step = 0; const c = S.st.config;
  const steps = [
    () => `<h2>Bem-vindo ao REASON O1 / VIBECODING</h2><p class="mut">Um mapa vivo do teu ecossistema de IA. Vê o que tens instalado — no Claude Code, Codex, Cursor, ChatGPT, Ollama — e diz-te o que falta a cada projeto.</p><p class="mut">É grátis e de código aberto: um obrigado à comunidade e uma antevisão do <b>REASON ONE</b> <span class="tag">coming soon</span>.</p><p class="dim" style="font-size:12.5px">Criado por ${creditLink()}.</p>`,
    () => `<h2>Quem és? <span class="tag">opcional</span></h2><p class="mut">Só para te tratar pelo nome. Fica neste PC e podes saltar: carrega em Seguinte.</p><div class="field"><label>Nome</label><input type="text" id="wN" value="${esc(c.owner.nome)}"></div><div class="field"><label>Email (opcional)</label><input type="email" id="wM" value="${esc(c.owner.email)}"></div>`,
    () => `<h2>Onde guardo tudo?</h2><p class="mut">Uma pasta-base, com subpastas por categoria: ${Object.values(S.st.pastas).map(p => `<span class="mono">${p}</span>`).join(" ")}</p><div class="field"><label>Pasta-base</label><input type="text" id="wB" value="${esc(c.base_dir)}"></div><div class="field"><label>Onde guardas os teus projetos (uma por linha)</label><textarea id="wR" rows="3">${esc(c.project_roots.join("\n"))}</textarea></div>`,
    () => `<h2>O que posso ler?</h2><p class="mut">Só leio nomes, contagens e datas. Nunca chaves, variáveis de ambiente nem o conteúdo das conversas.</p>${[["ferramentas", "Apps, skills, MCP, CLIs e modelos instalados"], ["projetos", "Repositórios git nas tuas pastas de projetos"], ["conversas", "Quantas conversas guardadas tens (não o conteúdo)"]].map(([k, l]) => `<label class="check"><input type="checkbox" data-w="${k}" ${c.consent[k] !== false ? "checked" : ""}><span>${l}</span></label>`).join("")}
       <label class="check"><input type="checkbox" id="wAuto" ${c.auto_update !== false ? "checked" : ""}><span><b>Manter-me sempre atualizado</b> — ao abrir, instala a versão nova do repositório oficial (com cópia de segurança).</span></label>`,
    () => `<h2>Termo de responsabilidade</h2><p class="mut">O REASON O1 é aberto e existe para ajudar. Lê os 8 pontos: são curtos.</p>${termsHtml()}
       <label class="check" style="margin-top:12px"><input type="checkbox" id="wT" ${c._termos ? "checked" : ""}><span>Li e aceito. Sei que o programa só aconselha e que a segurança do que instalo é responsabilidade minha.</span></label>`,
    () => `<h2>Pacote de arranque</h2><p class="mut">O que eu instalaria primeiro para trabalhares com fluidez, gastares menos tokens e errares menos. Já vêm marcados os essenciais; nada é instalado sem ti — no fim recebes os comandos e o pedido para o teu agente.</p>
       ${STARTER.map(([g, ns]) => `<div class="pack-g">${g}</div>${ns.map(n => { const it = starterItem(n); if (!it) return ""; const have = installedFlag(n); return `<label class="pick ${have ? "have" : ""}"><input type="checkbox" data-pk="${esc(n)}" ${(c._pack ? c._pack.includes(n) : STARTER_ON.has(n) && !have) ? "checked" : ""}><span><b>${esc(n)}</b> <span class="t-type">${TYPE[it.t] || esc(it.t)}</span> ${have ? `<span class="tag ok">já tens</span>` : ""}<small>${esc(it.p || "")}${it.v ? " · " + esc(it.v) : ""}</small></span></label>`; }).join("")}`).join("")}`,
    () => `<h2>Aprende de graça</h2><p class="mut">Não fiques só pela curiosidade: estes cursos são oficiais e grátis. Uma tarde com eles poupa semanas de tentativa e erro.</p>${coursesHtml()}<p class="dim" style="font-size:12.5px">Quando partilhares o que criaste, conta que começaste pelo REASON O1 — ajuda outros a encontrá-lo.</p>`,
    () => `<h2>Pronto.</h2><p class="mut">Vou criar as pastas e varrer o PC<span>${(c._pack || []).includes("Claude Cookbook") ? ", descarregar o Cookbook" : ""}</span><span>${(c._pack || []).filter(n => n !== "Claude Cookbook").length ? " e mostrar-te os passos do pacote de arranque" : ""}</span>. Depois abre o <b>Mapa de kits</b>, as <b>Tendências</b> e o <b>Conselho</b>.</p>`
  ];
  const keep = () => { if ($("#wN")) {c.owner.nome = $("#wN").value.trim(); c.owner.email = $("#wM").value.trim();} if ($("#wB")) {c.base_dir = $("#wB").value.trim(); c.project_roots = $("#wR").value.split("\n").map(s => s.trim()).filter(Boolean);} $$("[data-w]").forEach(x => c.consent[x.dataset.w] = x.checked); if ($("#wAuto")) c.auto_update = $("#wAuto").checked; if ($("#wT")) c._termos = $("#wT").checked; if ($$("[data-pk]").length) c._pack = $$("[data-pk]:checked").map(x => x.dataset.pk); };
  const draw = () => { modal(`<div class="wiz-steps">${steps.map((_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>${steps[step]()}<div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn" id="wBack" ${step ? "" : "disabled"}>Voltar</button><button class="btn pri" id="wNext">${step === steps.length - 1 ? "Criar e varrer" : "Seguinte"}</button></div>`);
    $("#modalBox [data-close]").remove();
    $("#wBack").onclick = () => { keep(); step--; draw(); };
    const wt = $("#wT"); if (wt) { $("#wNext").disabled = !wt.checked; wt.onchange = () => $("#wNext").disabled = !wt.checked; }
    $("#wNext").onclick = async () => { keep(); if (step < steps.length - 1) { step++; return draw(); } $("#wNext").textContent = "A varrer…"; await api("/api/setup", {owner: c.owner, base_dir: c.base_dir, project_roots: c.project_roots, consent: c.consent, auto_update: c.auto_update !== false, termos: new Date().toISOString().slice(0, 10)}); S.st = await api("/api/state"); S.inv = await api("/api/inventory?refresh=1"); S.mine = await api("/api/mine"); closeModal(); drawChips(); go("overview"); toast("Bem-vindo. O teu mapa está pronto.");
      const pk = c._pack || [];
      if (pk.includes("Claude Cookbook")) { toast("A descarregar o Claude Cookbook…"); api("/api/cookbook/clone", {}).then(r => toast(r.erro || r.texto)); }
      if (pk.some(n => n !== "Claude Cookbook")) setTimeout(() => packModal(pk), 700); }; };
  draw();
}

/* ---------- boot ---------- */
(async () => {
  [S.st, S.kits, S.cat, S.snap] = await Promise.all([api("/api/state"), api("/api/kits"), api("/api/catalog"), api("/api/snapshot")]);
  drawChips(); setupCmd();
  S.inv = await api("/api/inventory");
  [S.mine, S.mykits] = await Promise.all([api("/api/mine").catch(() => null), api("/api/mykits").catch(() => [])]);
  const start = (location.hash || "#overview").slice(1);
  go(NAV.some(n => n[0] === start) ? start : "overview");
  if (!S.st.config.setup_done) intro(wizard);
  else if (!S.st.config.termos) termsModal();
  const checkUpd = async () => { S.upd = await api("/api/update").catch(() => null); drawChips();
    if (S.upd?.estado === "nova" && S.st?.config?.auto_update !== false) doUpdate(); };
  const lu = S.st.ultima_atualizacao; if (lu && lu.para === S.st.about.version) setTimeout(() => toast(`Atualizado para a versão ${lu.para}.`), 900);
  checkUpd(); setInterval(checkUpd, 6 * 3600 * 1000);
})();

// ---------- language button: one button, four languages ----------
(() => { const b = $("#langBtn"), m = $("#langMenu");
  b.innerHTML = `${ic("globe", 15)}<span data-raw>${L.lang.toUpperCase()}</span>`;
  m.innerHTML = Object.entries(LANGS).map(([k, v]) => `<button role="menuitemradio" aria-checked="${k === L.lang}" data-lang="${k}" lang="${k}" data-raw><b>${k.toUpperCase()}</b>${v}</button>`).join("");
  const open = on => { m.hidden = !on; b.setAttribute("aria-expanded", on); if (on) m.querySelector("[aria-checked=true]")?.focus(); };
  b.onclick = e => { e.stopPropagation(); open(m.hidden); };
  document.addEventListener("click", e => { if (!e.target.closest(".langwrap")) open(false); });
  m.addEventListener("keydown", e => { const it = [...m.children], i = it.indexOf(document.activeElement);
    if (e.key === "Escape") { open(false); b.focus(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); it[(i + (e.key === "ArrowDown" ? 1 : -1) + it.length) % it.length].focus(); } });
})();

// ---------- app instalável (PWA) ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#installBtn").hidden = false; });
$("#installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === "accepted") toast("Instalado. Abre o REASON O1 pelo menu Iniciar."); installEvt = null; $("#installBtn").hidden = true; };
addEventListener("appinstalled", () => { $("#installBtn").hidden = true; });
</script>
</body>
