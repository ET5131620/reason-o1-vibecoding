<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REASON O1 · desligado</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04060c;color:#e8f1ff;font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding:16px;box-sizing:border-box}
.c{max-width:520px;text-align:center}img{width:96px;height:96px}h1{font-size:24px;margin:16px 0 6px}p{color:#8b9dbb}
code{background:rgba(56,225,255,.1);color:#38e1ff;padding:2px 8px;border-radius:6px;font-family:Consolas,monospace}
button{margin-top:18px;padding:11px 22px;border:0;border-radius:99px;background:#38e1ff;color:#04101a;font:600 15px inherit;cursor:pointer}
</style></head><body><div class="c">
<img src="/ui/icons/icon-192.png" alt="">
<h1 id="h">O REASON O1 não está a correr</h1>
<p id="p">A app vive no teu PC. Para a abrir, dá duplo clique em <code>ARRANCAR.bat</code> na pasta do REASON O1, ou corre <code>python reason_o1.py</code>. Depois volta aqui.</p>
<button id="b" onclick="location.reload()">Tentar outra vez</button>
</div>
<script>
// This page opens when the local server is off, so it carries its own four languages (no server to ask).
const T = {
  en: ["REASON O1 · offline", "REASON O1 is not running", "The app lives on your PC. To open it, double-click <code>ARRANCAR.bat</code> in the REASON O1 folder, or run <code>python reason_o1.py</code>. Then come back here.", "Try again"],
  fr: ["REASON O1 · hors ligne", "REASON O1 n'est pas lancé", "L'app vit sur votre PC. Pour l'ouvrir, double-cliquez sur <code>ARRANCAR.bat</code> dans le dossier REASON O1, ou lancez <code>python reason_o1.py</code>. Puis revenez ici.", "Réessayer"],
  es: ["REASON O1 · sin conexión", "REASON O1 no se está ejecutando", "La app vive en tu PC. Para abrirla, haz doble clic en <code>ARRANCAR.bat</code> en la carpeta de REASON O1, o ejecuta <code>python reason_o1.py</code>. Después vuelve aquí.", "Reintentar"]
};
let l = ""; try { l = localStorage.getItem("o1.lang") || ""; } catch {}
if (!T[l] && l !== "pt") l = (navigator.language || "").slice(0, 2);
if (T[l]) { const [t, h, p, b] = T[l]; document.documentElement.lang = l; document.title = t;
  document.getElementById("h").textContent = h; document.getElementById("p").innerHTML = p; document.getElementById("b").textContent = b; }
</script></body></html>
